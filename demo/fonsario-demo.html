<title>Fonsário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Fonsário — visual baseado na logo (verde-escuro, mostarda e creme).
   Layout: menu lateral verde fixo + área de trabalho clara; no celular
   o menu vira uma barra no rodapé, como um aplicativo.
   ===================================================================== */
:root {
  /* marca (tirada da logo) */
  --verde: #0d3d2b;
  --verde-2: #165a3f;
  --mostarda: #e5a32d;
  --creme: #fcefd7;

  /* superfícies e texto — tema claro */
  --bg: #f5f0e4;
  --surface: #fffcf6;
  --surface-2: #efe7d4;
  --line: #e3d8c0;
  --line-strong: #cbbd9c;
  --ink: #102a1f;
  --ink-2: #2f4a3d;
  --muted: #6c7a70;

  --primary: var(--verde);
  --on-primary: #fdf6e7;
  --primary-soft: #e0ece3;
  --link: #176044;
  --accent: var(--mostarda);
  --accent-soft: #fbedcd;
  --accent-ink: #7a5200;

  --success: #2c8a55; --success-soft: #dff1e5;
  --danger: #c4402c;  --danger-soft: #fae3dc;
  --warning: #b97a06; --warning-soft: #fbedcd;

  /* menu lateral (sempre verde, nos dois temas) */
  --side-bg: var(--verde);
  --side-ink: #eef4ec;
  --side-muted: #a6c1b1;
  --side-hover: rgba(255, 255, 255, .07);
  --side-ativo-bg: var(--mostarda);
  --side-ativo-ink: #0d3d2b;

  /* células da grade (cor da disciplina via --h) */
  --cel-s: 48%; --cel-l: 92%; --cel-b: 78%; --cel-t: 24%;

  --shadow-sm: 0 1px 2px rgba(16, 42, 31, .05);
  --shadow-md: 0 18px 40px -18px rgba(16, 42, 31, .28);
  --radius: 20px;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08140f; --surface: #0f1f18; --surface-2: #162b21; --line: #213a2e; --line-strong: #315040;
    --ink: #eef2ea; --ink-2: #c9d6cc; --muted: #8fa597;
    --primary: var(--mostarda); --on-primary: #0d3d2b; --primary-soft: rgba(95, 193, 151, .14); --link: #f0c062;
    --accent-soft: rgba(229, 163, 45, .16); --accent-ink: #f0c062;
    --success: #5cc995; --success-soft: rgba(92, 201, 149, .14); --danger: #f08a78; --danger-soft: rgba(240, 138, 120, .14);
    --warning: #f0c062; --warning-soft: rgba(240, 192, 98, .14);
    --side-bg: #0b2a1d; --side-hover: rgba(255, 255, 255, .06);
    --cel-s: 30%; --cel-l: 17%; --cel-b: 30%; --cel-t: 86%;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 18px 40px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08140f; --surface: #0f1f18; --surface-2: #162b21; --line: #213a2e; --line-strong: #315040;
  --ink: #eef2ea; --ink-2: #c9d6cc; --muted: #8fa597;
  --primary: var(--mostarda); --on-primary: #0d3d2b; --primary-soft: rgba(95, 193, 151, .14); --link: #f0c062;
  --accent-soft: rgba(229, 163, 45, .16); --accent-ink: #f0c062;
  --success: #5cc995; --success-soft: rgba(92, 201, 149, .14); --danger: #f08a78; --danger-soft: rgba(240, 138, 120, .14);
  --warning: #f0c062; --warning-soft: rgba(240, 192, 98, .14);
  --side-bg: #0b2a1d; --side-hover: rgba(255, 255, 255, .06);
  --cel-s: 30%; --cel-l: 17%; --cel-b: 30%; --cel-t: 86%;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 18px 40px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

/* ================= Base ================= */
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--font-body); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.i { width: 20px; height: 20px; flex-shrink: 0; }
.muted { color: var(--muted); }
.peq { font-size: .84rem; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

input, select {
  width: 100%; height: 46px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 14px; padding: 10px 14px; transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover { border-color: var(--line-strong); }
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: var(--verde-2); }
label.campo { display: grid; gap: 7px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
label.campo small { font-weight: 400; color: var(--muted); }
.grade-form { display: grid; gap: 16px; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* ================= Botões ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 650; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .15s, filter .15s;
}
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primario { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primario:hover { filter: brightness(1.12); }
.btn.perigo { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { height: 38px; padding: 0 15px; font-size: .86rem; }
.btn .i { width: 18px; height: 18px; }
.btn:disabled { opacity: .6; cursor: default; }
.icone-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; flex: none; transition: background .15s, color .15s;
}
.icone-btn:hover { background: var(--surface-2); color: var(--ink); }
.icone-btn.perigo:hover { background: var(--danger-soft); color: var(--danger); }
.icone-btn .i { width: 18px; height: 18px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--link); font-weight: 700; cursor: pointer; font-size: .86rem; }
.link-btn:hover { text-decoration: underline; }

/* ================= Marca ================= */
.brand { display: flex; align-items: center; gap: 12px; }
.brand .emblema { width: 46px; height: auto; flex: none; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .25)); }
.brand span { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; line-height: 1; letter-spacing: -.01em; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .76rem; letter-spacing: 0; margin-top: 5px; opacity: .75; }

/* ================= Entrada (login) ================= */
.login { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.login-arte {
  position: relative; overflow: hidden; background: var(--verde); color: var(--creme);
  padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
}
.login-arte::before {
  /* a grade do horário, como no quadro que o personagem segura */
  content: ""; position: absolute; inset: 0; opacity: .08;
  background-image: linear-gradient(var(--creme) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--creme) 1.5px, transparent 1.5px);
  background-size: 56px 56px; -webkit-mask-image: linear-gradient(160deg, #000 10%, transparent 75%); mask-image: linear-gradient(160deg, #000 10%, transparent 75%);
}
.login-arte::after {
  /* um quadradinho da grade em mostarda, como na logo */
  content: ""; position: absolute; width: 54.5px; height: 54.5px; left: calc(56px * 8 + 1.5px); top: calc(56px * 2 + 1.5px);
  background: var(--mostarda); opacity: .85;
}
.login-arte > * { position: relative; z-index: 1; }
.login-arte .brand { color: #fff; }
.login-arte .brand span { font-size: 2rem; }
.login-arte .brand .emblema { width: 64px; }
.login-arte h1 { font-size: clamp(2rem, 3.4vw, 3rem); line-height: 1.08; max-width: 14ch; color: #fff; }
.login-arte h1 em { font-style: normal; color: var(--mostarda); }
.login-arte .lead { margin-top: 16px; max-width: 40ch; color: #cfe0d5; font-size: 1.02rem; }
.recursos { display: grid; gap: 12px; margin-top: 28px; }
.recurso { display: flex; gap: 12px; align-items: center; font-size: .95rem; color: #e3ede6; }
.recurso .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .08); color: var(--mostarda); flex: none; }
.recurso .ic .i { width: 18px; height: 18px; }
.login-form-area { display: grid; place-items: center; padding: 40px 24px; background: var(--bg); }
.login-card { width: 100%; max-width: 400px; display: grid; gap: 18px; }
.login-card h2 { font-size: 2rem; }
.login-card .sub { color: var(--muted); margin-top: -10px; }
.erro-txt { color: var(--danger); font-size: .88rem; min-height: 1.2em; }
.demo-nota { font-size: .82rem; color: var(--muted); background: var(--surface-2); border-radius: 14px; padding: 12px 14px; line-height: 1.45; }

/* ================= Estrutura do app ================= */
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100dvh; }
.app > * { min-width: 0; }
.sidebar {
  position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 10px;
  padding: 24px 16px 18px; background: var(--side-bg); color: var(--side-ink);
}
.sidebar .brand { padding: 0 6px 22px; color: #fff; }
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-radius: 14px; background: none;
  color: var(--side-muted); font-weight: 600; cursor: pointer; text-align: left; white-space: nowrap; transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--side-hover); color: var(--side-ink); }
.nav-item.ativo { background: var(--side-ativo-bg); color: var(--side-ativo-ink); }
.badge {
  margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--danger); color: #fff;
  font-size: .72rem; font-weight: 800; display: grid; place-items: center;
}
.badge.amarelo { background: var(--creme); color: var(--verde); }
.nav-item.ativo .badge.amarelo { background: var(--verde); color: var(--creme); }
.user-card { display: grid; grid-template-columns: 36px minmax(0, 1fr); align-items: center; gap: 8px 10px; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, .06); }
.user-acoes { grid-column: 1 / -1; display: flex; gap: 6px; }
.user-acoes button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .06); color: var(--side-muted); font-size: .8rem; font-weight: 650; cursor: pointer; }
.user-acoes button:hover { background: rgba(255, 255, 255, .12); color: #fff; }
.user-acoes .i { width: 16px; height: 16px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--mostarda); color: var(--verde); display: grid; place-items: center; font-weight: 800; font-size: .8rem; flex: none; }
.user-card .quem { flex: 1; min-width: 0; }
.user-card strong { display: block; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-card .quem span { display: block; font-size: .74rem; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-card .icone-btn, .topo-movel .icone-btn { color: var(--side-muted); }
.user-card .icone-btn:hover, .topo-movel .icone-btn:hover { background: var(--side-hover); color: #fff; }
.topo-movel { display: none; }
.nav-item .curto { display: none; }

main.conteudo { padding: 36px 40px 56px; width: 100%; max-width: 1280px; margin: 0 auto; min-width: 0; }
.pg-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.pg-cab h1 { font-size: 2rem; line-height: 1.1; }
.pg-cab p { color: var(--muted); margin-top: 6px; max-width: 62ch; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); }
.card + .card { margin-top: 16px; }
.card h2 { font-size: 1.2rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.toolbar select { width: auto; min-width: 220px; font-weight: 600; }
.segmentado { display: inline-flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--surface-2); flex-wrap: wrap; }
.segmentado button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 650; font-size: .88rem; color: var(--muted); cursor: pointer; }
.segmentado button:hover { color: var(--ink); }
.segmentado button.ativo { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

.pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
.pill .i { width: 13px; height: 13px; }
.toolbar .pill { white-space: normal; height: auto; min-height: 26px; padding: 4px 11px; }
.verde { background: var(--success-soft); color: var(--success); }
.vermelho { background: var(--danger-soft); color: var(--danger); }
.amarelo { background: var(--accent-soft); color: var(--accent-ink); }
.azul { background: var(--primary-soft); color: var(--link); }
.neutro { background: var(--surface-2); color: var(--muted); }

.vazio-box { text-align: center; padding: 52px 20px; color: var(--muted); }
.vazio-box h3 { color: var(--ink); font-size: 1.2rem; margin-bottom: 6px; }

/* ================= Grade ================= */
.grade-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); }
table.grade { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 640px; table-layout: fixed; }
table.grade th, table.grade td { padding: 5px; vertical-align: top; border-bottom: 1px solid var(--line); }
table.grade tr:last-child > * { border-bottom: 0; }
table.grade thead th {
  font-family: var(--font-body); font-size: .74rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  padding: 14px 6px 12px; background: var(--surface);
}
table.grade th.hora { width: 86px; text-align: left; padding-left: 16px; font-size: .78rem; color: var(--muted); font-weight: 600; background: var(--surface); font-variant-numeric: tabular-nums; }
table.grade th.hora strong { display: block; color: var(--ink); font-size: .9rem; font-weight: 800; }
table.grade tr.separador td { background: var(--surface-2); font-size: .72rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 6px 16px; }
.cel {
  width: 100%; min-height: 62px; border-radius: 14px; border: 1.5px dashed var(--line-strong); background: none;
  cursor: pointer; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; color: var(--muted);
  font-size: .78rem; justify-content: center; align-items: flex-start; position: relative; transition: border-color .15s, background .15s, transform .15s;
}
.cel:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.cel.cheia { border: 1.5px solid hsl(var(--h) var(--cel-s) var(--cel-b)); background: hsl(var(--h) var(--cel-s) var(--cel-l)); color: hsl(var(--h) 45% var(--cel-t)); }
.cel.cheia:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.cel strong { font-size: .86rem; font-weight: 800; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; padding-right: 10px; max-width: 100%; }
.cel span { font-size: .74rem; opacity: .85; overflow-wrap: break-word; max-width: 100%; }
.cel.erro { outline: 2.5px solid var(--danger); outline-offset: 1px; }
.cel.erro::after {
  content: "!"; position: absolute; top: 5px; right: 6px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--danger); color: #fff; font-weight: 800; font-size: .72rem; display: grid; place-items: center;
}
.cel.bloqueada { background: repeating-linear-gradient(-45deg, var(--surface-2), var(--surface-2) 6px, transparent 6px, transparent 12px); border-style: solid; border-color: var(--line); }
.cel.so-leitura { cursor: default; }
.cel.so-leitura:not(.cheia):hover { border-color: var(--line-strong); color: var(--muted); background: none; }
.cel.so-leitura.bloqueada:hover { background: repeating-linear-gradient(-45deg, var(--surface-2), var(--surface-2) 6px, transparent 6px, transparent 12px); }
.cel .cadeado { position: absolute; right: 7px; bottom: 6px; display: grid; opacity: .7; }
.cel .cadeado .i { width: 13px; height: 13px; }
.cel.nova::before {
  content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--mostarda); box-shadow: 0 0 0 2px var(--surface);
}
.cel.erro.nova::before { display: none; }
.legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 12px; }
.legenda span { display: inline-flex; gap: 6px; align-items: center; }
.legenda i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; }

.colunas { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.lista-dist { display: grid; gap: 14px; }
.dist-item { display: grid; gap: 6px; }
.dist-item .topo { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.dist-item .topo strong { font-weight: 700; }
.dist-item .topo span.prof { display: block; font-size: .76rem; color: var(--muted); font-weight: 500; margin-left: 17px; }
.dist-item .topo > span { font-variant-numeric: tabular-nums; font-weight: 700; }
.barra { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.barra span { display: block; height: 100%; border-radius: inherit; background: var(--mostarda); }
.barra.ok span { background: var(--success); }
.barra.sobra span { background: var(--danger); }
.bolinha { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) 55% 48%); margin-right: 7px; }

/* ================= Avisos ================= */
.avisos { display: grid; gap: 8px; }
.aviso { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: 16px; font-size: .9rem; line-height: 1.45; }
.aviso .i { width: 18px; height: 18px; margin-top: 2px; flex: none; }
.aviso.erro { background: var(--danger-soft); }
.aviso.erro .i { color: var(--danger); }
.aviso.atencao { background: var(--warning-soft); }
.aviso.atencao .i { color: var(--warning); }
.aviso .corpo { flex: 1; min-width: 0; color: var(--ink-2); }
.aviso .corpo strong { color: var(--ink); }
.aviso .link-btn { white-space: nowrap; }
.aviso-acoes { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.tudo-certo { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--success-soft); color: var(--ink-2); font-size: .92rem; }
.tudo-certo .i { color: var(--success); }

/* ================= Tabelas de cadastro ================= */
table.lista { width: 100%; border-collapse: collapse; }
table.lista th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.lista td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: .92rem; vertical-align: middle; }
table.lista tr:last-child td { border-bottom: 0; }
table.lista tbody tr:hover td { background: var(--surface-2); }
table.lista td.acoes-td { text-align: right; white-space: nowrap; width: 1%; }
table.lista td.acoes-td > * { display: inline-grid; }
table.lista input, table.lista select { height: 38px; padding: 6px 10px; border-radius: 10px; }
.tabela-scroll { overflow-x: auto; }

/* ================= Janela (modal) ================= */
dialog#modal {
  border: 0; padding: 0; border-radius: 24px; width: min(540px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow-y: auto;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-md);
}
dialog#modal::backdrop { background: rgba(8, 26, 18, .55); backdrop-filter: blur(2px); }
.modal-corpo { padding: 24px; display: grid; gap: 14px; }

<script>
// =====================================================================
// Servidor de mentira para a DEMONSTRAÇÃO (sem banco de dados).
// Responde às mesmas rotas /api do server.js, guardando tudo no navegador.
// Só é usado na página de demonstração; o sistema real usa server.js + PostgreSQL.
// =====================================================================
(() => {
  const CHAVE = 'horario_demo_db_v1';
  const TURNOS_P = ['Manhã', 'Tarde', 'Noite'];
  const TURNOS_T = [...TURNOS_P, 'Integral'];
  const HORA = /^([01][0-9]|2[0-3]):[0-5][0-9]$/;

  function exemplo() {
    const d = { v: 1, seq: {}, sessoes: {}, usuarios: [], config: null, periodos: [], turmas: [], disciplinas: [], professores: [], indisponibilidades: [], distribuicao: [], aulas: [] };
    const novo = (tab, obj) => { d.seq[tab] = (d.seq[tab] || 0) + 1; const o = { id: d.seq[tab], ...obj }; d[tab].push(o); return o; };
    d.config = { escola: 'Escola Exemplo', rede: 'particular', dias: [1, 2, 3, 4, 5], duracao_aula: 50, max_disc_dia: 2, preferir_duplas: false };
    novo('usuarios', { nome: 'Coordenação Pedagógica', login: 'coordenacao@escola.com', senha: '123456', cargo: 'Coordenadora', ultimo_acesso: null, arquivado_em: null });
    const manha = [['07:00', '07:50'], ['07:50', '08:40'], ['08:40', '09:30'], ['09:50', '10:40'], ['10:40', '11:30']].map(([i, f]) => novo('periodos', { turno: 'Manhã', inicio: i, fim: f }).id);
    [['13:00', '13:50'], ['13:50', '14:40'], ['14:40', '15:30'], ['15:50', '16:40'], ['16:40', '17:30']].forEach(([i, f]) => novo('periodos', { turno: 'Tarde', inicio: i, fim: f }));
    const T = {};
    for (const [n, t] of [['6º Ano A', 'Manhã'], ['7º Ano A', 'Manhã'], ['8º Ano A', 'Manhã'], ['9º Ano A', 'Manhã'], ['6º Ano B', 'Tarde'], ['7º Ano B', 'Tarde']]) T[n] = novo('turmas', { nome: n, turno: t }).id;
    const X = {};
    ['Português', 'Matemática', 'Ciências', 'História', 'Geografia', 'Inglês', 'Arte', 'Educação Física'].forEach((n, i) => { X[n] = novo('disciplinas', { nome: n, cor: i }).id; });
    const P = {};
    for (const [n, j, l, md] of [['Ana Ribeiro', 20, 16, null], ['Lucas Martins', 20, 16, null], ['Bruno Costa', 20, 16, null], ['Fernanda Alves', 20, 16, null],
      ['Carla Mendes', 30, 22, null], ['Rafael Souza', 20, 12, null], ['Davi Nunes', 30, 20, null], ['Paula Lima', 20, 14, null],
      ['Elisa Prado', 20, 14, null], ['Marcos Dias', 20, 14, 5]]) {
      P[n] = novo('professores', { nome: n, jornada_horas: j, limite_aulas: l, max_aulas_dia: md }).id;
    }
    // Elisa não pode na sexta nas duas últimas aulas da manhã
    d.indisponibilidades.push({ professor_id: P['Elisa Prado'], dia: 5, periodo_id: manha[3] }, { professor_id: P['Elisa Prado'], dia: 5, periodo_id: manha[4] });
    const quem = {
      'Português': (t) => (['6º Ano A', '7º Ano A', '8º Ano A'].includes(t) ? 'Ana Ribeiro' : 'Lucas Martins'),
      'Matemática': (t) => (['6º Ano A', '7º Ano A', '8º Ano A'].includes(t) ? 'Bruno Costa' : 'Fernanda Alves'),
      'Ciências': (t) => (t.endsWith('B') ? 'Rafael Souza' : 'Carla Mendes'),
      'Arte': (t) => (t.endsWith('B') ? 'Rafael Souza' : 'Carla Mendes'),
      'História': () => 'Davi Nunes',
      'Geografia': () => 'Paula Lima',
      'Inglês': () => 'Elisa Prado',
      'Educação Física': () => 'Marcos Dias',
    };
    const carga = { 'Português': 5, 'Matemática': 5, 'Ciências': 3, 'História': 3, 'Geografia': 2, 'Inglês': 2, 'Arte': 2, 'Educação Física': 2 };
    const D = {};
    for (const t of Object.keys(T)) {
      for (const [disc, n] of Object.entries(carga)) {
        D[`${t}|${disc}`] = novo('distribuicao', { turma_id: T[t], disciplina_id: X[disc], professor_id: P[quem[disc](t)], aulas_semana: n }).id;
      }
    }
    // Segunda-feira do 6º A já montada e um choque de propósito no 7º A (Ana nas duas turmas às 07:00)
    ['Português', 'Português', 'Matemática', 'Ciências', 'História'].forEach((disc, i) => {
      d.aulas.push({ turma_id: T['6º Ano A'], dia: 1, periodo_id: manha[i], distribuicao_id: D[`6º Ano A|${disc}`], fixa: false });
    });
    d.aulas.push({ turma_id: T['7º Ano A'], dia: 1, periodo_id: manha[0], distribuicao_id: D['7º Ano A|Português'], fixa: false });
    d.aulas.push({ turma_id: T['7º Ano A'], dia: 1, periodo_id: manha[1], distribuicao_id: D['7º Ano A|Matemática'], fixa: false });
    return d;
  }

  let db = null;
  try { db = JSON.parse(localStorage.getItem(CHAVE)); } catch { db = null; }
  if (!db || db.v !== 1) db = exemplo();
  const gravar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(db)); } catch { /* sem armazenamento: só nesta aba */ } };
  window.__restaurarDemo = () => {
    try { localStorage.removeItem(CHAVE); localStorage.removeItem('horario_token'); localStorage.removeItem('horario_aba'); localStorage.removeItem('horario_turma'); } catch { /* ignora */ }
    db = exemplo();
    location.reload();
  };

  class Erro extends Error { constructor(s, m) { super(m); this.status = s; } }
  const falha = (s, m) => { throw new Erro(s, m); };
  const num = (v) => (Number.isInteger(Number(v)) && Number(v) > 0 ? Number(v) : 0);
  const texto = (v, max = 120) => String(v ?? '').trim().slice(0, max);
  const opcional = (v) => (v === '' || v === null || v === undefined ? null : Number(v));
  const diaOk = (d) => Number.isInteger(d) && d >= 1 && d <= 6;
  const novoId = (tab) => { db.seq[tab] = (db.seq[tab] || 0) + 1; return db.seq[tab]; };
  const achar = (tab, id) => db[tab].find((x) => x.id === id) || falha(404, 'Item não encontrado');
  const nomeUnico = (tab, nome, ignorar = 0) => {
    if (db[tab].some((x) => x.id !== ignorar && x.nome.toLowerCase() === nome.toLowerCase())) falha(409, 'Já existe um cadastro com esse nome.');
  };
  const turnoCabe = (turmaTurno, perTurno) => perTurno === turmaTurno || (turmaTurno === 'Integral' && (perTurno === 'Manhã' || perTurno === 'Tarde'));
  const ordemTurno = (t) => TURNOS_P.indexOf(t);
  const gerarSenha = () => Array.from({ length: 8 }, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 31)]).join('');

  // exclusões em cascata (como no banco real)
  function apagarDist(ids) {
    const s = new Set(ids);
    db.distribuicao = db.distribuicao.filter((d) => !s.has(d.id));
    db.aulas = db.aulas.filter((a) => !s.has(a.distribuicao_id));
  }

  function lerPeriodo(b) {
    const turno = texto(b.turno), inicio = texto(b.inicio), fim = texto(b.fim);
    if (!TURNOS_P.includes(turno)) falha(400, 'Escolha o turno');
    if (!HORA.test(inicio) || !HORA.test(fim)) falha(400, 'Use o formato de hora 07:00');
    if (fim <= inicio) falha(400, 'O fim precisa ser depois do início');
    return { turno, inicio, fim };
  }
  function lerProfessor(b) {
    const nome = texto(b.nome, 80), j = opcional(b.jornada_horas), l = opcional(b.limite_aulas), md = opcional(b.max_aulas_dia);
    if (!nome) falha(400, 'Informe o nome do professor');
    if (j !== null && !(j > 0 && j <= 60)) falha(400, 'A jornada deve ficar entre 1 e 60 horas por semana');
    if (l !== null && !(Number.isInteger(l) && l > 0 && l <= 80)) falha(400, 'O limite de aulas deve ser um número entre 1 e 80');
    if (md !== null && !(Number.isInteger(md) && md > 0 && md <= 20)) falha(400, 'O máximo de aulas por dia deve ser um número entre 1 e 20');
    return { nome, jornada_horas: j, limite_aulas: l, max_aulas_dia: md };
  }

  function rotear(metodo, caminho, b, token) {
    const r = (re) => caminho.match(re);
    if (metodo === 'POST' && caminho === '/login') {
      const login = texto(b.login).toLowerCase();
      const u = db.usuarios.find((x) => x.login.toLowerCase() === login);
      if (!u || u.senha !== String(b.senha ?? '')) falha(401, 'Usuário ou senha inválidos');
      if (u.arquivado_em) falha(403, 'Acesso desativado. Fale com a coordenação.');
      const tk = Math.random().toString(36).slice(2) + Date.now().toString(36);
      db.sessoes[tk] = u.id;
      u.ultimo_acesso = new Date().toISOString();
      return { token: tk, usuario: { id: u.id, nome: u.nome, login: u.login } };
    }
    const eu = db.usuarios.find((x) => x.id === db.sessoes[token] && !x.arquivado_em);
    if (!eu) falha(401, 'Sessão expirada. Entre novamente.');

    if (metodo === 'POST' && caminho === '/logout') { delete db.sessoes[token]; return { ok: true }; }
    if (metodo === 'GET' && caminho === '/me') return { id: eu.id, nome: eu.nome, login: eu.login, cargo: eu.cargo };
    if (metodo === 'PUT' && caminho === '/me/senha') {
      if (String(b.atual) !== eu.senha) falha(400, 'A senha atual está incorreta');
      const nova = String(b.nova ?? '');
      if (nova.length < 6) falha(400, 'A nova senha precisa ter pelo menos 6 caracteres');
      if (nova === eu.senha) falha(400, 'A nova senha precisa ser diferente da atual');
      eu.senha = nova;
      return { ok: true };
    }
    if (metodo === 'GET' && caminho === '/dados') {
      const c = JSON.parse(JSON.stringify(db));
      return {
        config: c.config,
        periodos: c.periodos.sort((a, b2) => ordemTurno(a.turno) - ordemTurno(b2.turno) || (a.inicio < b2.inicio ? -1 : 1)),
        turmas: c.turmas.sort((a, b2) => a.nome.localeCompare(b2.nome)),
        disciplinas: c.disciplinas.sort((a, b2) => a.nome.localeCompare(b2.nome)),
        professores: c.professores.sort((a, b2) => a.nome.localeCompare(b2.nome)),
        indisponibilidades: c.indisponibilidades, distribuicao: c.distribuicao, aulas: c.aulas,
      };
    }
    if (metodo === 'PUT' && caminho === '/config') {
      const escola = texto(b.escola), dias = [...new Set((b.dias || []).map(Number))].filter(diaOk).sort();
      const dur = Number(b.duracao_aula), md = b.max_disc_dia === undefined ? 2 : Number(b.max_disc_dia);
      if (!escola) falha(400, 'Informe o nome da escola');
      if (!dias.length) falha(400, 'Escolha pelo menos um dia de aula');
      if (!Number.isInteger(dur) || dur < 20 || dur > 120) falha(400, 'A duração da aula deve ficar entre 20 e 120 minutos');
      if (!Number.isInteger(md) || md < 1 || md > 10) falha(400, 'O máximo de aulas da mesma disciplina por dia deve ficar entre 1 e 10');
      db.config = { escola, rede: b.rede === 'publica' ? 'publica' : 'particular', dias, duracao_aula: dur, max_disc_dia: md, preferir_duplas: b.preferir_duplas === true };
      return { ok: true };
    }
    // ---- horários das aulas
    if (caminho === '/periodos' && metodo === 'POST') {
      const p = lerPeriodo(b);
      if (db.periodos.some((x) => x.turno === p.turno && x.inicio < p.fim && x.fim > p.inicio)) falha(400, 'Esse horário se sobrepõe a outra aula do mesmo turno');
      const id = novoId('periodos'); db.periodos.push({ id, ...p }); return { id };
    }
    let m = r(/^\/periodos\/(\d+)$/);
    if (m && metodo === 'PUT') {
      const x = achar('periodos', num(m[1])), p = lerPeriodo(b);
      if (db.periodos.some((y) => y.id !== x.id && y.turno === p.turno && y.inicio < p.fim && y.fim > p.inicio)) falha(400, 'Esse horário se sobrepõe a outra aula do mesmo turno');
      Object.assign(x, p); return { ok: true };
    }
    if (m && metodo === 'DELETE') {
      const id = achar('periodos', num(m[1])).id;
      db.periodos = db.periodos.filter((x) => x.id !== id);
      db.indisponibilidades = db.indisponibilidades.filter((x) => x.periodo_id !== id);
      db.aulas = db.aulas.filter((x) => x.periodo_id !== id);
      return { ok: true };
    }
    // ---- turmas
    if (caminho === '/turmas' && metodo === 'POST') {
      const nome = texto(b.nome, 60), turno = texto(b.turno);
      if (!nome) falha(400, 'Informe o nome da turma');
      if (!TURNOS_T.includes(turno)) falha(400, 'Escolha o turno');
      nomeUnico('turmas', nome);
      const id = novoId('turmas'); db.turmas.push({ id, nome, turno }); return { id };
    }
    m = r(/^\/turmas\/(\d+)\/aulas$/);
    if (m && metodo === 'DELETE') {
      const id = num(m[1]), antes = db.aulas.length;
      db.aulas = db.aulas.filter((a) => a.turma_id !== id || a.fixa);
      return { ok: true, apagadas: antes - db.aulas.length };
    }
    m = r(/^\/turmas\/(\d+)$/);
    if (m && metodo === 'PUT') {
      const x = achar('turmas', num(m[1])), nome = texto(b.nome, 60), turno = texto(b.turno);
      if (!nome) falha(400, 'Informe o nome da turma');
      if (!TURNOS_T.includes(turno)) falha(400, 'Escolha o turno');
      nomeUnico('turmas', nome, x.id);
      Object.assign(x, { nome, turno }); return { ok: true };
    }
    if (m && metodo === 'DELETE') {
      const id = achar('turmas', num(m[1])).id;
      db.turmas = db.turmas.filter((x) => x.id !== id);
      apagarDist(db.distribuicao.filter((d) => d.turma_id === id).map((d) => d.id));
      db.aulas = db.aulas.filter((a) => a.turma_id !== id);
      return { ok: true };
    }
    // ---- disciplinas
    if (caminho === '/disciplinas' && metodo === 'POST') {
      const nome = texto(b.nome, 60);
      if (!nome) falha(400, 'Informe o nome da disciplina');
      nomeUnico('disciplinas', nome);
      const id = novoId('disciplinas'); db.disciplinas.push({ id, nome, cor: db.disciplinas.length % 12 }); return { id };
    }
    m = r(/^\/disciplinas\/(\d+)$/);
    if (m && metodo === 'PUT') {
      const x = achar('disciplinas', num(m[1])), nome = texto(b.nome, 60);
      if (!nome) falha(400, 'Informe o nome da disciplina');
      nomeUnico('disciplinas', nome, x.id);
      x.nome = nome; return { ok: true };
    }
    if (m && metodo === 'DELETE') {
      const id = achar('disciplinas', num(m[1])).id;
      db.disciplinas = db.disciplinas.filter((x) => x.id !== id);
      apagarDist(db.distribuicao.filter((d) => d.disciplina_id === id).map((d) => d.id));
      return { ok: true };
    }
    // ---- professores
    if (caminho === '/professores' && metodo === 'POST') {
      const id = novoId('professores'); db.professores.push({ id, ...lerProfessor(b) }); return { id };
    }
    m = r(/^\/professores\/(\d+)\/indisponibilidades$/);
    if (m && metodo === 'PUT') {
      const id = achar('professores', num(m[1])).id;
      const ok = new Set(db.periodos.map((p) => p.id));
      const itens = (Array.isArray(b.itens) ? b.itens : []).map((i) => ({ professor_id: id, dia: Number(i?.dia), periodo_id: num(i?.periodo_id) }))
        .filter((i) => diaOk(i.dia) && i.periodo_id);
      if (itens.some((i) => !ok.has(i.periodo_id))) falha(400, 'Um dos itens escolhidos não existe mais. Atualize a página.');
      db.indisponibilidades = db.indisponibilidades.filter((i) => i.professor_id !== id).concat(itens);
      return { ok: true };
    }
    m = r(/^\/professores\/(\d+)$/);
    if (m && metodo === 'PUT') { Object.assign(achar('professores', num(m[1])), lerProfessor(b)); return { ok: true }; }
    if (m && metodo === 'DELETE') {
      const id = achar('professores', num(m[1])).id;
      db.professores = db.professores.filter((x) => x.id !== id);
      db.indisponibilidades = db.indisponibilidades.filter((x) => x.professor_id !== id);
      apagarDist(db.distribuicao.filter((d) => d.professor_id === id).map((d) => d.id));
      return { ok: true };
    }
    // ---- distribuição
    if (caminho === '/distribuicao' && metodo === 'POST') {
      const t = num(b.turma_id), x = num(b.disciplina_id), p = num(b.professor_id), n = Number(b.aulas_semana);
      if (!t || !x || !p) falha(400, 'Escolha a turma, a disciplina e o professor');
      if (!Number.isInteger(n) || n < 1 || n > 40) falha(400, 'Informe quantas aulas por semana (1 a 40)');
      achar('turmas', t); achar('disciplinas', x); achar('professores', p);
      if (db.distribuicao.some((d) => d.turma_id === t && d.disciplina_id === x)) falha(409, 'Essa disciplina já está na distribuição desta turma');
      const id = novoId('distribuicao'); db.distribuicao.push({ id, turma_id: t, disciplina_id: x, professor_id: p, aulas_semana: n }); return { id };
    }
    m = r(/^\/distribuicao\/(\d+)$/);
    if (m && metodo === 'PUT') {
      const d = achar('distribuicao', num(m[1])), p = num(b.professor_id), n = Number(b.aulas_semana);
      if (!p) falha(400, 'Escolha o professor');
      if (!Number.isInteger(n) || n < 1 || n > 40) falha(400, 'Informe quantas aulas por semana (1 a 40)');
      achar('professores', p);
      Object.assign(d, { professor_id: p, aulas_semana: n }); return { ok: true };
    }
    if (m && metodo === 'DELETE') { apagarDist([achar('distribuicao', num(m[1])).id]); return { ok: true }; }
    // ---- grade
    const validarCel = (a) => {
      const t = db.turmas.find((x) => x.id === num(a.turma_id)), p = db.periodos.find((x) => x.id === num(a.periodo_id)), dia = Number(a.dia);
      if (!t || !p || !diaOk(dia)) falha(400, 'Uma das aulas aponta para turma, horário ou dia que não existe mais. Atualize a página.');
      if (!turnoCabe(t.turno, p.turno)) falha(400, 'Esse horário não é do turno desta turma');
      const dist = a.distribuicao_id ? num(a.distribuicao_id) : null;
      if (dist !== null && !db.distribuicao.some((d) => d.id === dist && d.turma_id === t.id)) falha(400, 'Essa disciplina não está na distribuição desta turma');
      return { turma_id: t.id, dia, periodo_id: p.id, dist };
    };
    const celIdx = (c) => db.aulas.findIndex((a) => a.turma_id === c.turma_id && a.dia === c.dia && a.periodo_id === c.periodo_id);
    if (caminho === '/aulas' && metodo === 'PUT') {
      const c = validarCel(b), i = celIdx(c);
      if (c.dist === null) { if (i >= 0) db.aulas.splice(i, 1); return { ok: true }; }
      if (i >= 0) Object.assign(db.aulas[i], { distribuicao_id: c.dist, fixa: false });
      else db.aulas.push({ turma_id: c.turma_id, dia: c.dia, periodo_id: c.periodo_id, distribuicao_id: c.dist, fixa: false });
      return { ok: true };
    }
    if (caminho === '/aulas/fixar' && metodo === 'POST') {
      const i = celIdx({ turma_id: num(b.turma_id), dia: Number(b.dia), periodo_id: num(b.periodo_id) });
      if (i < 0) falha(404, 'Aula não encontrada');
      db.aulas[i].fixa = b.fixa === true; return { ok: true };
    }
    if (caminho === '/aulas/lote' && metodo === 'POST') {
      if (!Array.isArray(b.alteracoes) || b.alteracoes.length > 5000) falha(400, 'Lista de alterações inválida');
      const finais = new Map();
      for (const a of b.alteracoes) { const c = validarCel(a); finais.set(`${c.turma_id}|${c.dia}|${c.periodo_id}`, c); }
      // tudo validado: agora aplica (tudo ou nada)
      const limpar = new Set((b.limpar_turmas || []).map(num));
      if (limpar.size) db.aulas = db.aulas.filter((a) => !limpar.has(a.turma_id) || a.fixa || !db.config.dias.includes(a.dia));
      for (const c of finais.values()) {
        const i = celIdx(c);
        if (i >= 0 && db.aulas[i].fixa) continue;
        if (c.dist === null) { if (i >= 0) db.aulas.splice(i, 1); continue; }
        if (i >= 0) db.aulas[i].distribuicao_id = c.dist;
        else db.aulas.push({ turma_id: c.turma_id, dia: c.dia, periodo_id: c.periodo_id, distribuicao_id: c.dist, fixa: false });
      }
      return { ok: true, alteradas: finais.size };
    }
    // ---- equipe
    if (caminho === '/usuarios' && metodo === 'GET') {
      return db.usuarios.map(({ senha, ...u }) => u).sort((a, b2) => (a.arquivado_em ? 1 : 0) - (b2.arquivado_em ? 1 : 0) || a.nome.localeCompare(b2.nome));
    }
    if (caminho === '/usuarios' && metodo === 'POST') {
      const nome = texto(b.nome, 80), login = texto(b.login, 80).toLowerCase();
      if (!nome) falha(400, 'Informe o nome');
      if (!/^[a-z0-9._@-]{3,80}$/.test(login)) falha(400, 'O login deve ter pelo menos 3 letras ou números, sem espaços (pode ser o e-mail)');
      if (db.usuarios.some((u) => u.login === login)) falha(409, 'Esse login já está em uso');
      const senha = gerarSenha();
      db.usuarios.push({ id: novoId('usuarios'), nome, login, senha, cargo: texto(b.cargo, 60) || null, ultimo_acesso: null, arquivado_em: null });
      return { login, senha };
    }
    m = r(/^\/usuarios\/(\d+)\/nova-senha$/);
    if (m && metodo === 'POST') { const u = achar('usuarios', num(m[1])); u.senha = gerarSenha(); return { login: u.login, senha: u.senha }; }
    m = r(/^\/usuarios\/(\d+)\/arquivar$/);
    if (m && metodo === 'POST') {
      const u = achar('usuarios', num(m[1]));
      if (u.id === eu.id) falha(400, 'Você não pode desativar o próprio acesso');
      if (b.ativo === true) u.arquivado_em = null;
      else {
        if (!db.usuarios.some((x) => x.id !== u.id && !x.arquivado_em)) falha(400, 'Precisa ficar pelo menos uma pessoa com acesso');
        u.arquivado_em = new Date().toISOString();
      }
      return { ok: true };
    }
    falha(404, 'Rota não encontrada');
  }

  const fetchOriginal = window.fetch.bind(window);
  window.fetch = async (url, opts = {}) => {
    const u = String(url);
    if (!u.startsWith('/api')) return fetchOriginal(url, opts);
    const metodo = (opts.method || 'GET').toUpperCase();
    const token = String(opts.headers?.Authorization || '').replace(/^Bearer /, '');
    let corpo = {};
    try { corpo = opts.body ? JSON.parse(opts.body) : {}; } catch { corpo = {}; }
    const copia = JSON.stringify(db);
    try {
      const r = rotear(metodo, u.slice(4), corpo, token);
      gravar();
      return new Response(JSON.stringify(r), { status: 200, headers: { 'Content-Type': 'application/json' } });
    } catch (e) {
      db = JSON.parse(copia); // tudo ou nada, como a transação do banco
      const status = e instanceof Erro ? e.status : 500;
      return new Response(JSON.stringify({ erro: e instanceof Erro ? e.message : 'Erro inesperado. Tente de novo.' }), { status, headers: { 'Content-Type': 'application/json' } });
    }
  };
})();

<script>
// =====================================================================
// Gerador automático de horário + sugestões para resolver choques.
// Roda no navegador: recebe os dados (/api/dados) e devolve propostas.
// Nada é salvo aqui; quem salva é o app, depois que a coordenação aprova.
//
// Regras obrigatórias (nunca quebra):
//   - uma aula por horário em cada turma;
//   - professor não fica em duas turmas ao mesmo tempo (inclusive turnos que se sobrepõem);
//   - professor não recebe aula em horário que marcou "não pode";
//   - no máximo N aulas da mesma disciplina por dia na turma (Configurações);
//   - no máximo X aulas por dia para o professor, se cadastrado;
//   - aulas fixas (travadas) não se mexem.
// Preferências (tenta melhorar):
//   - menos "janelas" (buracos) no dia do professor;
//   - menos dias de deslocamento para o professor;
//   - espalhar a disciplina pela semana, ou aula dupla seguida se a escola preferir.
//
// Por dentro tudo vira número (índices) para ficar rápido: dá para testar
// dezenas de combinações em poucos segundos.
// =====================================================================
'use strict';
const Gerador = (() => {
  const sobrepoe = (a, b) => a.inicio < b.fim && b.inicio < a.fim;

  // Sorteio com semente (para "gerar outra opção" dar resultados diferentes)
  function sorteio(semente) {
    let s = semente >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function embaralhar(lista, rnd) {
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }
    return lista;
  }

  // ---------- Tudo o que não muda durante a geração ----------
  function contexto(D) {
    const per = D.periodos;
    const P = per.length;
    const pIdx = new Map(per.map((p, i) => [p.id, i]));
    const sobre = per.map((p) => per.map((q, j) => (sobrepoe(p, q) ? j : -1)).filter((j) => j >= 0));
    const turnos = ['Manhã', 'Tarde', 'Noite'].map((tn) => per.map((p, i) => [p, i]).filter(([p]) => p.turno === tn)
      .sort((a, b) => (a[0].inicio < b[0].inicio ? -1 : 1)).map(([, i]) => i)).filter((l) => l.length);
    const posNoTurno = new Int16Array(P);
    const turnoDe = new Int16Array(P);
    turnos.forEach((l, ti) => l.forEach((i, k) => { posNoTurno[i] = k; turnoDe[i] = ti; }));

    const dias = [...D.config.dias];
    const Dn = dias.length;
    const diaIdx = new Map(dias.map((d, i) => [d, i]));

    const turmas = D.turmas;
    const T = turmas.length;
    const tIdx = new Map(turmas.map((t, i) => [t.id, i]));
    const slots = turmas.map((t) => (t.turno === 'Integral'
      ? per.map((p, i) => [p, i]).filter(([p]) => p.turno === 'Manhã' || p.turno === 'Tarde')
      : per.map((p, i) => [p, i]).filter(([p]) => p.turno === t.turno))
      .sort((a, b) => (a[0].turno === b[0].turno ? (a[0].inicio < b[0].inicio ? -1 : 1) : (turnoDe[a[1]] - turnoDe[b[1]])))
      .map(([, i]) => i));
    // pares de horários seguidos (mesmo turno) de cada turma, para achar aulas duplas
    const pares = slots.map((sl) => {
      const r = [];
      for (let k = 0; k + 1 < sl.length; k++) {
        if (turnoDe[sl[k]] === turnoDe[sl[k + 1]] && posNoTurno[sl[k + 1]] === posNoTurno[sl[k]] + 1) r.push([sl[k], sl[k + 1]]);
      }
      return r;
    });

    const profs = D.professores;
    const Pr = profs.length;
    const prIdx = new Map(profs.map((p, i) => [p.id, i]));
    const maxDia = Int16Array.from(profs, (p) => p.max_aulas_dia || 0);

    const dists = D.distribuicao;
    const Di = dists.length;
    const dIdx = new Map(dists.map((d, i) => [d.id, i]));
    const dTurma = Int32Array.from(dists, (d) => tIdx.get(d.turma_id));
    const dProf = Int32Array.from(dists, (d) => prIdx.get(d.professor_id));

    const indisp = new Uint8Array(Pr * Dn * P);
    for (const i of D.indisponibilidades) {
      const pr = prIdx.get(i.professor_id), d = diaIdx.get(i.dia), p = pIdx.get(i.periodo_id);
      if (pr !== undefined && d !== undefined && p !== undefined) indisp[(pr * Dn + d) * P + p] = 1;
    }
    return {
      D, P, Dn, T, Pr, Di, per, pIdx, sobre, turnos, dias, diaIdx, turmas, tIdx, slots, pares,
      profs, prIdx, maxDia, dists, dIdx, dTurma, dProf, indisp,
      maxDisc: D.config.max_disc_dia || 2,
      duplas: !!D.config.preferir_duplas,
    };
  }

  // ---------- Estado de uma grade ----------
  class Grade {
    constructor(ctx, vazio = true) {
      this.ctx = ctx;
      if (!vazio) return;
      const { T, Dn, P, Pr, Di } = ctx;
      this.cel = new Int32Array(T * Dn * P);   // índice da distribuição + 1 (0 = vago)
      this.fixa = new Uint8Array(T * Dn * P);
      this.po = new Int16Array(Pr * Dn * P);   // aulas do professor em cada horário
      this.pdc = new Int16Array(Pr * Dn);      // aulas do professor no dia
      this.dd = new Int16Array(Di * Dn);       // aulas da disciplina (linha da distribuição) no dia
    }
    clonar() {
      const g = new Grade(this.ctx, false);
      g.cel = this.cel.slice(); g.fixa = this.fixa.slice(); g.po = this.po.slice(); g.pdc = this.pdc.slice(); g.dd = this.dd.slice();
      return g;
    }
    ci(t, d, p) { return (t * this.ctx.Dn + d) * this.ctx.P + p; }
    decod(c) {
      const { P, Dn } = this.ctx;
      const p = c % P, td = (c - p) / P;
      return [Math.floor(td / Dn), td % Dn, p];
    }
    por(t, d, p, di, fixa = 0) {
      const c = this.ci(t, d, p), { Dn, P } = this.ctx, pr = this.ctx.dProf[di];
      this.cel[c] = di + 1;
      this.fixa[c] = fixa ? 1 : 0;
      this.po[(pr * Dn + d) * P + p]++;
      this.pdc[pr * Dn + d]++;
      this.dd[di * Dn + d]++;
    }
    tirar(t, d, p) {
      const c = this.ci(t, d, p);
      const di = this.cel[c] - 1;
      if (di < 0) return -1;
      const { Dn, P } = this.ctx, pr = this.ctx.dProf[di];
      this.cel[c] = 0;
      this.fixa[c] = 0;
      this.po[(pr * Dn + d) * P + p]--;
      this.pdc[pr * Dn + d]--;
      this.dd[di * Dn + d]--;
      return di;
    }
    profLivre(pr, d, p) {
      const { Dn, P, sobre } = this.ctx, base = (pr * Dn + d) * P;
      for (const q of sobre[p]) if (this.po[base + q] > 0) return false;
      return true;
    }
    pode(t, d, p, di) {
      const ctx = this.ctx;
      if (this.cel[this.ci(t, d, p)]) return false;
      const pr = ctx.dProf[di];
      if (ctx.indisp[(pr * ctx.Dn + d) * ctx.P + p]) return false;
      if (this.dd[di * ctx.Dn + d] >= ctx.maxDisc) return false;
      if (ctx.maxDia[pr] && this.pdc[pr * ctx.Dn + d] >= ctx.maxDia[pr]) return false;
      return this.profLivre(pr, d, p);
    }
    // células (de qualquer turma) em que o professor está num horário que bate com p
    choques(pr, d, p) {
      const ctx = this.ctx, r = [];
      for (let t = 0; t < ctx.T; t++) {
        for (const q of ctx.sobre[p]) {
          const c = this.ci(t, d, q);
          if (this.cel[c] && ctx.dProf[this.cel[c] - 1] === pr) r.push(c);
        }
      }
      return r;
    }
    janelas(pr, d) {
      if (this.pdc[pr * this.ctx.Dn + d] < 2) return 0;
      const { Dn, P, turnos } = this.ctx, base = (pr * Dn + d) * P;
      let j = 0;
      for (const l of turnos) {
        let ini = -1, fim = -1, n = 0;
        for (let k = 0; k < l.length; k++) if (this.po[base + l[k]] > 0) { if (ini < 0) ini = k; fim = k; n++; }
        if (n > 1) j += fim - ini + 1 - n;
      }
      return j;
    }
  }

  // ---------- Custo (quanto menor, melhor) ----------
  function custoProfDia(g, pr, d) {
    return g.pdc[pr * g.ctx.Dn + d] ? 3 + g.janelas(pr, d) * 2 : 0;
  }
  function custoDistDia(g, di, d) {
    const n = g.dd[di * g.ctx.Dn + d];
    if (n < 2) return 0;
    const t = g.ctx.dTurma[di];
    let seguidos = 0;
    for (const [a, b] of g.ctx.pares[t]) if (g.cel[g.ci(t, d, a)] === di + 1 && g.cel[g.ci(t, d, b)] === di + 1) seguidos++;
    const soltos = n - 1 - seguidos;
    return g.ctx.duplas ? soltos * 4 - seguidos * 2 : seguidos * 2 + soltos * 5;
  }
  function custoTotal(g) {
    const { Pr, Di, Dn } = g.ctx;
    let c = 0;
    for (let pr = 0; pr < Pr; pr++) for (let d = 0; d < Dn; d++) c += custoProfDia(g, pr, d);
    for (let di = 0; di < Di; di++) for (let d = 0; d < Dn; d++) c += custoDistDia(g, di, d);
    return c;
  }
  // Diferença de custo ao colocar a aula nesta célula
  function custoColocar(g, t, d, p, di) {
    const pr = g.ctx.dProf[di];
    const antes = custoProfDia(g, pr, d) + custoDistDia(g, di, d);
    g.por(t, d, p, di);
    const depois = custoProfDia(g, pr, d) + custoDistDia(g, di, d);
    g.tirar(t, d, p);
    return depois - antes;
  }

  function contarLivres(g, di) {
    const t = g.ctx.dTurma[di];
    let n = 0;
    for (let d = 0; d < g.ctx.Dn; d++) for (const p of g.ctx.slots[t]) if (g.pode(t, d, p, di)) n++;
    return n;
  }
  function melhorLugar(g, di, rnd, evitar = -1) {
    const t = g.ctx.dTurma[di];
    let melhor = null, mc = Infinity;
    for (let d = 0; d < g.ctx.Dn; d++) {
      for (const p of g.ctx.slots[t]) {
        if (!g.pode(t, d, p, di) || g.ci(t, d, p) === evitar) continue;
        const c = custoColocar(g, t, d, p, di) + (rnd ? rnd() * 1.5 : 0);
        if (c < mc) { mc = c; melhor = [d, p]; }
      }
    }
    return melhor;
  }

  // Quando a disciplina não cabe: tenta abrir espaço mudando UMA outra aula de lugar
  function reparar(g, di, moveis, rnd) {
    const ctx = g.ctx, t = ctx.dTurma[di], pr = ctx.dProf[di];
    const celulas = [];
    for (let d = 0; d < ctx.Dn; d++) for (const p of ctx.slots[t]) celulas.push([d, p]);
    for (const [d, p] of embaralhar(celulas, rnd)) {
      if (ctx.indisp[(pr * ctx.Dn + d) * ctx.P + p]) continue;
      if (g.dd[di * ctx.Dn + d] >= ctx.maxDisc) continue;
      const c = g.ci(t, d, p);
      if (g.cel[c]) {
        // A) a turma está ocupada nesse horário por outra aula que pode mudar de lugar
        if (!moveis.has(c)) continue;
        const outra = g.tirar(t, d, p);
        if (g.pode(t, d, p, di)) {
          g.por(t, d, p, di);
          const novo = melhorLugar(g, outra, rnd, c);
          if (novo) {
            g.por(t, novo[0], novo[1], outra);
            moveis.add(g.ci(t, novo[0], novo[1]));
            return true;
          }
          g.tirar(t, d, p);
        }
        g.por(t, d, p, outra);
        continue;
      }
      // B) a turma está livre, mas o professor está em outra turma nesse horário
      const ch = g.choques(pr, d, p);
      if (ch.length !== 1 || !moveis.has(ch[0])) continue;
      const [t2, d2, p2] = g.decod(ch[0]);
      const outra = g.tirar(t2, d2, p2);
      if (g.pode(t, d, p, di)) {
        g.por(t, d, p, di);
        const novo = melhorLugar(g, outra, rnd, ch[0]);
        if (novo) {
          moveis.delete(ch[0]);
          g.por(t2, novo[0], novo[1], outra);
          moveis.add(g.ci(t2, novo[0], novo[1]));
          moveis.add(c);
          return true;
        }
        g.tirar(t, d, p);
      }
      g.por(t2, d2, p2, outra);
    }
    return false;
  }

  // Ajuste fino: troca aulas de lugar dentro da mesma turma quando isso diminui o custo
  function melhorar(g, moveis, rnd, tentativas) {
    const ctx = g.ctx;
    let mv = [...moveis];
    for (let n = 0; n < tentativas && mv.length; n++) {
      if (n % 300 === 0) mv = [...moveis];
      const ca = mv[Math.floor(rnd() * mv.length)];
      if (!moveis.has(ca)) continue;
      const [t, dA, pA] = g.decod(ca);
      const sl = ctx.slots[t];
      const dB = Math.floor(rnd() * ctx.Dn), pB = sl[Math.floor(rnd() * sl.length)];
      const cb = g.ci(t, dB, pB);
      if (ca === cb) continue;
      if (g.cel[cb] && !moveis.has(cb)) continue;
      const a = g.cel[ca] - 1, b = g.cel[cb] - 1;
      if (a < 0) { moveis.delete(ca); continue; }
      if (a === b) continue;
      const prA = ctx.dProf[a], prB = b >= 0 ? ctx.dProf[b] : -1;
      const custo = () => {
        let c = custoProfDia(g, prA, dA) + custoDistDia(g, a, dA) + custoDistDia(g, a, dB);
        if (dB !== dA) c += custoProfDia(g, prA, dB);
        if (b >= 0) {
          c += custoDistDia(g, b, dA) + custoDistDia(g, b, dB);
          if (prB !== prA) { c += custoProfDia(g, prB, dA); if (dB !== dA) c += custoProfDia(g, prB, dB); }
        }
        return c;
      };
      const antes = custo();
      g.tirar(t, dA, pA);
      if (b >= 0) g.tirar(t, dB, pB);
      let ok = g.pode(t, dB, pB, a);
      if (ok) {
        g.por(t, dB, pB, a);
        if (b >= 0) { ok = g.pode(t, dA, pA, b); if (ok) g.por(t, dA, pA, b); else g.tirar(t, dB, pB); }
      }
      if (ok) {
        const depois = custo();
        if (depois < antes || (depois === antes && rnd() < 0.3)) {
          if (b < 0) { moveis.delete(ca); moveis.add(cb); }
          continue;
        }
        g.tirar(t, dB, pB);
        if (b >= 0) g.tirar(t, dA, pA);
      }
      g.por(t, dA, pA, a);
      if (b >= 0) g.por(t, dB, pB, b);
    }
  }

  // Uma tentativa completa
  function rodada(base, demandas, rnd) {
    const g = base.clonar();
    const resta = new Map(demandas); // índice da distribuição -> aulas que faltam
    const moveis = new Set();
    const faltou = new Map();
    const { dTurma, Dn } = g.ctx;
    while (resta.size) {
      // a disciplina com menos opções por aula restante vai primeiro
      let escolhida = -1, menor = Infinity;
      for (const [di, n] of resta) {
        const s = contarLivres(g, di) / n + rnd() * 0.5;
        if (s < menor) { menor = s; escolhida = di; }
      }
      let colocou = false;
      const l = melhorLugar(g, escolhida, rnd);
      if (l) {
        g.por(dTurma[escolhida], l[0], l[1], escolhida);
        moveis.add(g.ci(dTurma[escolhida], l[0], l[1]));
        colocou = true;
      } else {
        colocou = reparar(g, escolhida, moveis, rnd);
      }
      if (colocou) {
        const n = resta.get(escolhida) - 1;
        n ? resta.set(escolhida, n) : resta.delete(escolhida);
      } else {
        faltou.set(escolhida, resta.get(escolhida));
        resta.delete(escolhida);
      }
    }
    melhorar(g, moveis, rnd, Math.min(40000, 60 * moveis.size + 500));
    // depois do ajuste fino, tenta de novo o que tinha sobrado
    for (const [di, n] of [...faltou]) {
      let k = n;
      while (k > 0) {
        const l = melhorLugar(g, di, null);
        if (l) { g.por(dTurma[di], l[0], l[1], di); moveis.add(g.ci(dTurma[di], l[0], l[1])); k--; }
        else if (reparar(g, di, moveis, rnd)) k--;
        else break;
      }
      k ? faltou.set(di, k) : faltou.delete(di);
    }
    let nFaltou = 0;
    for (const x of faltou.values()) nFaltou += x;
    void Dn;
    return { g, faltou, custo: nFaltou * 1000 + custoTotal(g) };
  }

  // Por que uma disciplina não coube (em português simples)
  function explicar(g, di) {
    const ctx = g.ctx, t = ctx.dTurma[di], pr = ctx.dProf[di];
    const turma = ctx.turmas[t].nome, prof = ctx.profs[pr].nome;
    let vagos = 0, naoPode = 0, ocupado = 0, limiteDia = 0, limiteDisc = 0;
    for (let d = 0; d < ctx.Dn; d++) {
      for (const p of ctx.slots[t]) {
        if (g.cel[g.ci(t, d, p)]) continue;
        vagos++;
        if (ctx.indisp[(pr * ctx.Dn + d) * ctx.P + p]) naoPode++;
        else if (!g.profLivre(pr, d, p)) ocupado++;
        else if (g.dd[di * ctx.Dn + d] >= ctx.maxDisc) limiteDisc++;
        else limiteDia++;
      }
    }
    if (!vagos) {
      // procura aulas a mais ocupando espaço na turma
      const sobras = [];
      ctx.dists.forEach((x, xi) => {
        if (ctx.dTurma[xi] !== t) return;
        let n = 0;
        for (let d = 0; d < ctx.Dn; d++) n += g.dd[xi * ctx.Dn + d];
        if (n > x.aulas_semana) sobras.push(`${ctx.D.disciplinas.find((y) => y.id === x.disciplina_id)?.nome} (${n} de ${x.aulas_semana})`);
      });
      if (sobras.length) return `o ${turma} não tem mais horários vagos porque há aulas a mais na grade: ${sobras.join(', ')}. Tire as aulas a mais (botão Resolver nos Avisos) ou use "Refazer do zero".`;
      return `o ${turma} não tem mais horários vagos (a distribuição pede mais aulas do que a grade comporta).`;
    }
    const partes = [];
    if (ocupado) partes.push(`${ocupado} em que ${prof} já está em outra turma`);
    if (naoPode) partes.push(`${naoPode} em que ${prof} marcou que não pode`);
    if (limiteDisc) partes.push(`${limiteDisc} em dias que já têm o máximo de aulas desta disciplina`);
    if (limiteDia) partes.push(`${limiteDia} em dias em que ${prof} já atingiu o máximo de aulas por dia`);
    return `sobraram ${vagos} horário(s) vago(s) no ${turma}: ${partes.join('; ')}.`;
  }

  // Monta a grade a partir das aulas salvas (só dias letivos)
  function carregarGrade(ctx, aulas, filtro = () => true) {
    const g = new Grade(ctx);
    const fora = [];
    for (const a of aulas) {
      const t = ctx.tIdx.get(a.turma_id), d = ctx.diaIdx.get(a.dia), p = ctx.pIdx.get(a.periodo_id), di = ctx.dIdx.get(a.distribuicao_id);
      if (d === undefined || t === undefined || p === undefined || di === undefined) { fora.push(a); continue; }
      if (!filtro(a)) continue;
      if (g.cel[g.ci(t, d, p)]) continue;
      g.por(t, d, p, di, a.fixa);
    }
    return { g, fora };
  }
  function paraAulas(g) {
    const ctx = g.ctx, r = [];
    for (let c = 0; c < g.cel.length; c++) {
      if (!g.cel[c]) continue;
      const [t, d, p] = g.decod(c);
      r.push({ turma_id: ctx.turmas[t].id, dia: ctx.dias[d], periodo_id: ctx.per[p].id, distribuicao_id: ctx.dists[g.cel[c] - 1].id, fixa: !!g.fixa[c] });
    }
    return r;
  }

  // ---------- Gerar ----------
  // escopo: Set de ids de turma a montar; manter: mantém o que já está colocado nelas (só completa)
  function gerar(D, { escopo, manter = true, semente = Date.now(), tempoMs = 2000 } = {}) {
    const ctx = contexto(D);
    // fica no lugar: aula fixa, aula de turma fora do escopo, ou tudo se for "completar"
    const { g: base, fora } = carregarGrade(ctx, D.aulas, (a) => a.fixa || !escopo.has(a.turma_id) || manter);
    const demandas = new Map();
    let pedidas = 0;
    ctx.dists.forEach((d, di) => {
      if (!escopo.has(d.turma_id)) return;
      pedidas += d.aulas_semana;
      let ja = 0;
      for (let k = 0; k < ctx.Dn; k++) ja += base.dd[di * ctx.Dn + k];
      if (d.aulas_semana > ja) demandas.set(di, d.aulas_semana - ja);
    });
    const rnd = sorteio(semente);
    const inicio = performance.now();
    let melhor = null, rodadas = 0;
    do {
      const r = rodada(base, demandas, sorteio(Math.floor(rnd() * 2 ** 32)));
      rodadas++;
      if (!melhor || r.custo < melhor.custo) melhor = r;
    } while (performance.now() - inicio < tempoMs && rodadas < 80);

    const g = melhor.g;
    const aulas = [...fora, ...paraAulas(g)];
    const k = (a) => `${a.turma_id}|${a.dia}|${a.periodo_id}`;
    const antes = new Set(D.aulas.map((a) => `${k(a)}#${a.distribuicao_id}`));
    const novas = new Set(aulas.filter((a) => escopo.has(a.turma_id) && !antes.has(`${k(a)}#${a.distribuicao_id}`)).map(k));
    let janelas = 0;
    for (let pr = 0; pr < ctx.Pr; pr++) for (let d = 0; d < ctx.Dn; d++) janelas += g.janelas(pr, d);
    const faltou = [...melhor.faltou].map(([di, n]) => ({ dist_id: ctx.dists[di].id, n, motivo: explicar(g, di) }));
    const naoColocadas = faltou.reduce((s, f) => s + f.n, 0);
    return {
      aulas, novas, faltou,
      resumo: { pedidas, colocadas: pedidas - naoColocadas, janelas, rodadas, ms: Math.round(performance.now() - inicio) },
      // o que o servidor precisa para salvar
      lote: {
        limpar_turmas: [...escopo],
        alteracoes: aulas.filter((a) => escopo.has(a.turma_id) && !a.fixa && ctx.diaIdx.has(a.dia))
          .map((a) => ({ turma_id: a.turma_id, dia: a.dia, periodo_id: a.periodo_id, distribuicao_id: a.distribuicao_id })),
      },
    };
  }

  // ---------- Opções para resolver uma aula com problema ----------
  function opcoes(D, ref) {
    const ctx = contexto(D);
    const { g } = carregarGrade(ctx, D.aulas);
    const vazio = { mover: [], trocar: [], professores: [], livres: [] };
    const t = ctx.tIdx.get(ref.turma_id), d = ctx.diaIdx.get(ref.dia), p = ctx.pIdx.get(ref.periodo_id);
    if (t === undefined || d === undefined || p === undefined) return vazio;
    const c = g.ci(t, d, p);
    if (!g.cel[c]) return vazio;
    if (g.fixa[c]) return { ...vazio, fixa: true };
    const di = g.tirar(t, d, p);
    const dist = ctx.dists[di];
    const id = (tt, dd, pp, x) => ({ turma_id: ctx.turmas[tt].id, dia: ctx.dias[dd], periodo_id: ctx.per[pp].id, distribuicao_id: x === null ? null : ctx.dists[x].id });

    // 1) mover para um horário vago da turma
    const mover = [];
    for (let d2 = 0; d2 < ctx.Dn; d2++) {
      for (const p2 of ctx.slots[t]) {
        if ((d2 === d && p2 === p) || !g.pode(t, d2, p2, di)) continue;
        mover.push({ dia: ctx.dias[d2], periodo_id: ctx.per[p2].id, custo: custoColocar(g, t, d2, p2, di), alteracoes: [id(t, d, p, null), id(t, d2, p2, di)] });
      }
    }
    // 2) trocar de lugar com outra aula da mesma turma
    const trocar = [];
    for (let d2 = 0; d2 < ctx.Dn; d2++) {
      for (const p2 of ctx.slots[t]) {
        const c2 = g.ci(t, d2, p2);
        const outra = g.cel[c2] - 1;
        if (outra < 0 || g.fixa[c2] || outra === di) continue;
        g.tirar(t, d2, p2);
        let ok = false, custo = 0;
        if (g.pode(t, d2, p2, di)) {
          g.por(t, d2, p2, di);
          if (g.pode(t, d, p, outra)) { ok = true; custo = custoColocar(g, t, d, p, outra); }
          g.tirar(t, d2, p2);
        }
        g.por(t, d2, p2, outra);
        if (ok) trocar.push({ dia: ctx.dias[d2], periodo_id: ctx.per[p2].id, dist: ctx.dists[outra].id, custo, alteracoes: [id(t, d2, p2, di), id(t, d, p, outra)] });
      }
    }
    // 3) outro professor que já dá a disciplina e está livre em todas as aulas dela nesta turma
    const aulasDaDist = [[d, p]];
    for (let d2 = 0; d2 < ctx.Dn; d2++) for (const p2 of ctx.slots[t]) if (g.cel[g.ci(t, d2, p2)] === di + 1) aulasDaDist.push([d2, p2]);
    // tira temporariamente todas as aulas desta disciplina na turma para testar outro professor
    for (const [d2, p2] of aulasDaDist.slice(1)) g.tirar(t, d2, p2);
    const discDoProf = new Map();
    for (const x of D.distribuicao) {
      if (!discDoProf.has(x.professor_id)) discDoProf.set(x.professor_id, new Set());
      discDoProf.get(x.professor_id).add(x.disciplina_id);
    }
    const professores = [], livres = [];
    const prAtual = ctx.dProf[di];
    ctx.profs.forEach((q, pr) => {
      if (pr === prAtual) return;
      const livreEm = (dd, pp) => !ctx.indisp[(pr * ctx.Dn + dd) * ctx.P + pp] && g.profLivre(pr, dd, pp);
      if (!livreEm(d, p)) return;
      const mesmaDisc = !!discDoProf.get(q.id)?.has(dist.disciplina_id);
      livres.push({ id: q.id, nome: q.nome, mesmaDisc });
      if (mesmaDisc && aulasDaDist.every(([dd, pp]) => livreEm(dd, pp))) {
        professores.push({ id: q.id, nome: q.nome, dist_id: dist.id, aulas_semana: dist.aulas_semana });
      }
    });
    for (const [d2, p2] of aulasDaDist.slice(1)) g.por(t, d2, p2, di);
    g.por(t, d, p, di);
    mover.sort((a, b) => a.custo - b.custo);
    trocar.sort((a, b) => a.custo - b.custo);
    livres.sort((a, b) => b.mesmaDisc - a.mesmaDisc || a.nome.localeCompare(b.nome));
    return { mover: mover.slice(0, 4), trocar: trocar.slice(0, 4), professores, livres };
  }

  // Janelas do professor na semana (para mostrar na tela)
  function janelasProfessor(D, profId) {
    const ctx = contexto(D);
    const pr = ctx.prIdx.get(profId);
    if (pr === undefined) return 0;
    const { g } = carregarGrade(ctx, D.aulas);
    let j = 0;
    for (let d = 0; d < ctx.Dn; d++) j += g.janelas(pr, d);
    return j;
  }

  return { gerar, opcoes, janelasProfessor };
})();

const storage = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const state = {
  token: storage.get('horario_token'),
  user: null,
  aba: storage.get('horario_aba') || 'grade',
  dados: null,
  calc: null,
  turmaId: Number(storage.get('horario_turma')) || 0,
  profId: 0,
  cad: 'turmas',
  distTurma: 0,
  editandoIndisp: null, // Set com "dia|periodo" enquanto marca os horários em que o professor não pode
  previa: null,         // proposta do gerador automático ainda não salva
};

const DIAS = { 1: 'Segunda', 2: 'Terça', 3: 'Quarta', 4: 'Quinta', 5: 'Sexta', 6: 'Sábado' };
const DIAS_CURTO = { 1: 'Seg', 2: 'Ter', 3: 'Qua', 4: 'Qui', 5: 'Sex', 6: 'Sáb' };
const TURNOS = ['Manhã', 'Tarde', 'Noite'];
// tons das disciplinas, escolhidos para combinar com o verde e o mostarda da marca
const HUES = [150, 38, 12, 205, 285, 85, 340, 175, 24, 228, 55, 0];

// ================= Utilidades =================
async function api(caminho, { method = 'GET', body } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  const res = await fetch('/api' + caminho, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && caminho !== '/login') { sairLocal(); throw new Error(data.erro || 'Sessão expirada'); }
  if (!res.ok) throw new Error(data.erro || 'Erro inesperado');
  return data;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dadosForm = (form) => Object.fromEntries(new FormData(form));
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const byId = (lista) => Object.fromEntries(lista.map((x) => [x.id, x]));
const hue = (disc) => HUES[(disc?.cor ?? 0) % HUES.length];
const sobrepoe = (a, b) => a.inicio < b.fim && b.inicio < a.fim;
function horas(h) {
  const min = Math.round(h * 60);
  const hh = Math.floor(min / 60), mm = min % 60;
  return mm ? `${hh}h${String(mm).padStart(2, '0')}` : `${hh}h`;
}
let toastTimer;
function toast(msg, erro = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'ver' + (erro ? ' erro' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ''), 2800);
}
function sairLocal() {
  state.token = null; state.user = null; state.dados = null;
  storage.set('horario_token', null);
  if ($modal.open) $modal.close();
  render();
}
// Tema atual: o escolhido no botão ou, se ninguém escolheu, o do aparelho
function tema() {
  const t = document.documentElement.dataset.theme;
  if (t) return t === 'dark' ? 'dark' : 'light';
  try { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch { return 'light'; }
}

// Abre um formulário. onSubmit recebe os dados; se der erro, a mensagem aparece no modal.
function modal({ titulo, sub = '', corpo, botao = 'Salvar', perigo = false, onSubmit, semRodape = false }) {
  $modal.innerHTML = `
    <form class="modal-corpo" method="dialog" novalidate>
      <div class="modal-cab">
        <div><h2>${esc(titulo)}</h2>${sub ? `<p>${sub}</p>` : ''}</div>
        <button type="button" class="icone-btn" data-fechar aria-label="Fechar">${icon('x')}</button>
      </div>
      ${corpo}
      <p class="erro-txt" data-erro></p>
      ${semRodape ? '' : `<div class="modal-rodape">
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="submit" class="btn ${perigo ? 'perigo' : 'primario'}">${esc(botao)}</button>
      </div>`}
    </form>`;
  const form = $modal.querySelector('form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!onSubmit) return $modal.close();
    const b = form.querySelector('[type=submit]');
    if (b) b.disabled = true;
    try {
      const r = await onSubmit(dadosForm(form), form);
      if (r !== false && $modal.open) $modal.close();
    } catch (err) {
      form.querySelector('[data-erro]').textContent = err.message;
    } finally {
      if (b) b.disabled = false;
    }
  });
  $modal.querySelectorAll('[data-fechar]').forEach((b) => b.addEventListener('click', () => $modal.close()));
  $modal.showModal();
  form.querySelector('input:not([type=hidden]), select')?.focus();
  return form;
}
const confirmar = (titulo, texto, botao = 'Excluir') => new Promise((ok) => {
  let sim = false;
  modal({ titulo, corpo: `<p class="muted">${texto}</p>`, botao, perigo: true, onSubmit: () => { sim = true; } });
  $modal.addEventListener('close', () => ok(sim), { once: true });
});

async function carregar() {
  state.dados = await api('/dados');
  calcular();
}
async function salvar(fn, msg) {
  if (state.previa) {
    toast('Há uma prévia do gerador na tela. Aplique ou descarte antes de editar.', true);
    throw new Error('prévia aberta');
  }
  try {
    await fn();
    await carregar();
    render();
    if (msg) toast(msg);
  } catch (e) {
    toast(e.message, true);
    throw e;
  }
}

function periodosDaTurma(t) {
  const P = state.dados.periodos;
  return t.turno === 'Integral' ? P.filter((p) => p.turno === 'Manhã' || p.turno === 'Tarde') : P.filter((p) => p.turno === t.turno);
}

function calcular() {
  const D = state.dados;
  const m = { dist: byId(D.distribuicao), disc: byId(D.disciplinas), prof: byId(D.professores), turma: byId(D.turmas), per: byId(D.periodos) };
  const diasLetivos = new Set(D.config.dias);
  const indisp = new Set(D.indisponibilidades.map((i) => `${i.professor_id}|${i.dia}|${i.periodo_id}`));
  const aulas = D.aulas.map((a) => {
    const d = m.dist[a.distribuicao_id];
    return { ...a, dist: d, prof_id: d.professor_id, disc_id: d.disciplina_id, per: m.per[a.periodo_id] };
  });
  const problemas = {}; // "turma|dia|periodo" -> [textos]
  const marcar = (a, txt) => (problemas[`${a.turma_id}|${a.dia}|${a.periodo_id}`] ||= []).push(txt);
  const avisos = [];
  const nomeHora = (a) => `${DIAS[a.dia]}, ${a.per.inicio}`;
  const ref = (a) => ({ turma_id: a.turma_id, dia: a.dia, periodo_id: a.periodo_id });

  // 1) Professor em duas turmas ao mesmo tempo
  const porProfDia = {};
  for (const a of aulas) if (diasLetivos.has(a.dia)) (porProfDia[`${a.prof_id}|${a.dia}`] ||= []).push(a);
  for (const lista of Object.values(porProfDia)) {
    for (let i = 0; i < lista.length; i++) {
      for (let j = i + 1; j < lista.length; j++) {
        const a = lista[i], b = lista[j];
        if (a.turma_id === b.turma_id || !sobrepoe(a.per, b.per)) continue;
        const p = m.prof[a.prof_id].nome, ta = m.turma[a.turma_id].nome, tb = m.turma[b.turma_id].nome;
        marcar(a, `${p} também está no ${tb} neste horário`);
        marcar(b, `${p} também está no ${ta} neste horário`);
        avisos.push({ nivel: 'erro', tipo: 'Conflito', turma_id: a.turma_id, turmas: [a.turma_id, b.turma_id], prof_id: a.prof_id, aulas: [ref(a), ref(b)],
          texto: `<strong>${esc(p)}</strong> está em duas turmas ao mesmo tempo: ${esc(ta)} e ${esc(tb)} (${nomeHora(a)}).` });
      }
    }
  }
  // 2) Aula em horário em que o professor não pode
  for (const a of aulas) {
    if (!diasLetivos.has(a.dia) || !indisp.has(`${a.prof_id}|${a.dia}|${a.periodo_id}`)) continue;
    const p = m.prof[a.prof_id].nome;
    marcar(a, `${p} marcou que não pode neste horário`);
    avisos.push({ nivel: 'erro', tipo: 'Indisponível', turma_id: a.turma_id, prof_id: a.prof_id, aulas: [ref(a)],
      texto: `<strong>${esc(p)}</strong> não pode na ${nomeHora(a)}, mas está com aula no ${esc(m.turma[a.turma_id].nome)}.` });
  }
  // 2b) Mais aulas da mesma disciplina no dia do que o permitido; professor acima do máximo por dia
  const maxDisc = D.config.max_disc_dia || 2;
  const porDistDia = {}, porProfDia2 = {};
  for (const a of aulas) {
    if (!diasLetivos.has(a.dia)) continue;
    (porDistDia[`${a.distribuicao_id}|${a.dia}`] ||= []).push(a);
    porProfDia2[`${a.prof_id}|${a.dia}`] = (porProfDia2[`${a.prof_id}|${a.dia}`] || 0) + 1;
  }
  for (const [k, lista] of Object.entries(porDistDia)) {
    if (lista.length <= maxDisc) continue;
    const a = lista[0];
    for (const x of lista) marcar(x, `mais de ${maxDisc} aulas de ${m.disc[a.disc_id].nome} neste dia`);
    avisos.push({ nivel: 'atencao', tipo: 'Muitas no dia', turma_id: a.turma_id,
      texto: `<strong>${esc(m.turma[a.turma_id].nome)}</strong>: ${lista.length} aulas de ${esc(m.disc[a.disc_id].nome)} na ${DIAS[a.dia]} (o máximo combinado é ${maxDisc} por dia).` });
  }
  for (const [k, n] of Object.entries(porProfDia2)) {
    const [pid, dia] = k.split('|').map(Number);
    const p = m.prof[pid];
    if (p.max_aulas_dia && n > p.max_aulas_dia) {
      avisos.push({ nivel: 'atencao', tipo: 'Muitas no dia', prof_id: pid,
        texto: `<strong>${esc(p.nome)}</strong> tem ${n} aulas na ${DIAS[dia]}, acima do máximo de ${p.max_aulas_dia} por dia.` });
    }
  }
  // 3) Carga do professor
  const cargaProf = {};
  for (const p of D.professores) cargaProf[p.id] = { planejadas: 0, naGrade: 0 };
  for (const d of D.distribuicao) cargaProf[d.professor_id].planejadas += d.aulas_semana;
  for (const a of aulas) if (diasLetivos.has(a.dia)) cargaProf[a.prof_id].naGrade++;
  const publica = D.config.rede === 'publica';
  for (const p of D.professores) {
    const c = cargaProf[p.id];
    const n = Math.max(c.planejadas, c.naGrade);
    c.horasSala = (n * D.config.duracao_aula) / 60;
    if (p.limite_aulas && n > p.limite_aulas) {
      avisos.push({ nivel: 'atencao', tipo: 'Carga', prof_id: p.id,
        texto: `<strong>${esc(p.nome)}</strong> tem ${n} aulas por semana, acima do limite de ${p.limite_aulas} definido pela escola.` });
    }
    if (publica && p.jornada_horas) {
      c.maxSala = (p.jornada_horas * 2) / 3;
      if (c.horasSala > c.maxSala + 1e-9) {
        avisos.push({ nivel: 'atencao', tipo: 'Lei do Piso', prof_id: p.id,
          texto: `<strong>${esc(p.nome)}</strong>: ${n} aulas de ${D.config.duracao_aula} min = ${horas(c.horasSala)} com alunos. Na rede pública o máximo é 2/3 da jornada de ${horas(p.jornada_horas)} (${horas(c.maxSala)}).` });
      }
    }
  }
  // 4) Aulas faltando ou sobrando em cada turma; turma sem espaço
  const naGradeDist = {};
  for (const a of aulas) if (diasLetivos.has(a.dia)) naGradeDist[a.distribuicao_id] = (naGradeDist[a.distribuicao_id] || 0) + 1;
  for (const t of D.turmas) {
    const ds = D.distribuicao.filter((d) => d.turma_id === t.id);
    const pedidas = ds.reduce((s, d) => s + d.aulas_semana, 0);
    const vagas = periodosDaTurma(t).length * D.config.dias.length;
    if (pedidas > vagas) {
      avisos.push({ nivel: 'erro', tipo: 'Sem espaço', turma_id: t.id,
        texto: `<strong>${esc(t.nome)}</strong>: a distribuição pede ${pedidas} aulas por semana, mas a grade só tem ${vagas} horários.` });
    }
    for (const d of ds) {
      const n = naGradeDist[d.id] || 0, disc = m.disc[d.disciplina_id].nome;
      if (n > d.aulas_semana) {
        avisos.push({ nivel: 'erro', tipo: 'Aula a mais', turma_id: t.id, sobra: d.id,
          texto: `<strong>${esc(t.nome)}</strong>: ${esc(disc)} está com ${n} aulas na grade, mas o combinado é ${d.aulas_semana}.` });
      } else if (n < d.aulas_semana) {
        avisos.push({ nivel: 'pendente', tipo: 'Falta colocar', turma_id: t.id,
          texto: `<strong>${esc(t.nome)}</strong>: falta${d.aulas_semana - n > 1 ? 'm' : ''} ${plural(d.aulas_semana - n, 'aula', 'aulas')} de ${esc(disc)} (${n} de ${d.aulas_semana}).` });
      }
    }
  }
  // 5) Aulas guardadas em dias que deixaram de ser letivos
  const foraDia = aulas.filter((a) => !diasLetivos.has(a.dia));
  if (foraDia.length) {
    avisos.push({ nivel: 'atencao', tipo: 'Dia sem aula', texto: `${plural(foraDia.length, 'aula está guardada', 'aulas estão guardadas')} em dias que não são mais letivos (${[...new Set(foraDia.map((a) => DIAS[a.dia]))].join(', ')}). Elas não aparecem na grade; volte o dia em Configurações para vê-las.` });
  }
  avisos.forEach((a, i) => (a.idx = i));
  state.calc = { m, aulas, problemas, avisos, cargaProf, naGradeDist, indisp };
}

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const r = await api('/login', { method: 'POST', body: dadosForm(e.target) });
      state.token = r.token;
      storage.set('horario_token', r.token);
      await iniciar();
    } catch (err) {
      document.getElementById('erro-login').textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });
}
